name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the complete Git history
        uses: actions/checkout@v4
        with:
          # The release gate includes a full-history Gitleaks scan.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Create project virtual environment
        run: python -m venv .venv

      - name: Install pinned dependencies and verify integrity
        run: |
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install --requirement requirements.txt
          .venv/bin/python -m pip check

      - name: Compile project Python
        run: .venv/bin/python -m compileall -q panlib bin vendor/seedhub-cli

      - name: Run the complete test suite
        run: .venv/bin/python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Check every CLI help path
        run: |
          set -eu
          # 自动发现，不维护硬编码清单——此前那份清单漏掉了 10 个算子
          # （audit/container/lib/library/master/offlinedl/plan/run/sandbox/share），
          # 新增算子默认不受检查，且失效方式是静默的：没人会收到通知。
          # 按 shebang 分派解释器（doctor 是 bash，其余是 Python），新算子自动纳入。
          failed=0
          for cli in bin/panlib-*; do
            [ -f "$cli" ] || continue
            if head -1 "$cli" | grep -q bash; then
              runner="bash"
            else
              runner=".venv/bin/python"
            fi
            if ! $runner "$cli" --help >/dev/null 2>&1; then
              echo "FAIL: $cli --help (runner=$runner)"
              failed=$((failed + 1))
            fi
          done
          [ "$failed" -eq 0 ] || { echo "$failed 个 CLI 的 --help 不可用"; exit 1; }

      - name: Verify the mutation test still proves the operator spec has teeth
        run: bash scripts/mutation_test_operator_spec.sh

      - name: Run the whole-tree privacy guard
        run: ./scripts/privacy-guard --whole-tree

      - name: Install pinned Gitleaks and scan complete Git history
        run: |
          set -eu
          go install github.com/zricethezav/gitleaks/v8@v8.24.2
          "$(go env GOPATH)/bin/gitleaks" detect \
            --source . \
            --redact \
            --config .gitleaks.toml \
            --log-opts='--all'
